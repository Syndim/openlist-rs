[package]
name = "openlist"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the OpenList API"
license = "AGPL-3.0"

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "multipart", "query"] }
bytes = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
chrono = { version = "0.4.43", features = ["serde"] }
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
mockito = "1.7.2"
