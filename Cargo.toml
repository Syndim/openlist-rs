[package]
name = "openlist"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for the OpenList API"
license = "AGPL-3.0"

[dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "query"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
mockito = "1"
