[workspace]
members = ["crates/openlist", "crates/openlist-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0"
repository = "https://github.com/Syndim/openlist-rs"

[workspace.dependencies]
openlist = { path = "crates/openlist" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
