name: Integration

# End-to-end tests that start a real OpenList server and drive the CLI through
# upload, list and download operations. The server binary is always taken from
# the latest upstream release so API drift is caught without pinning a version.
#
# The workflow is also reusable: the release pipeline calls it before building
# the artifacts, so a tag is only published when these tests pass.
on:
  push:
    # Tag pushes are handled by the Release workflow, which calls this workflow
    # as a job. Running here too would duplicate every release run.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Formatting and lints
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with rust-version in the workspace manifest and the
      # Requirements section of the README.
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the minimum supported Rust version
        run: cargo check --workspace --all-targets --locked

  cli:
    name: CLI integration tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download latest OpenList server
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/openlist-server"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/openlist.tar.gz" \
            "https://github.com/OpenListTeam/OpenList/releases/latest/download/openlist-linux-amd64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/openlist.tar.gz" -C "${RUNNER_TEMP}/openlist-server"
          chmod +x "${RUNNER_TEMP}/openlist-server/openlist"
          echo "OPENLIST_TEST_SERVER_BIN=${RUNNER_TEMP}/openlist-server/openlist" >> "${GITHUB_ENV}"
          "${RUNNER_TEMP}/openlist-server/openlist" version

      # Every test target: the mockito-backed SDK/CLI unit tests and the
      # end-to-end suite, which picks up OPENLIST_TEST_SERVER_BIN from above.
      - name: Run all tests
        env:
          OPENLIST_TEST_KEEP_TEMP: "1"
        run: cargo test --workspace --locked -- --nocapture

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openlist-server-logs
          path: /tmp/openlist-rs-integration-*
          if-no-files-found: ignore
          retention-days: 7
