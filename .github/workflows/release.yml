name: Release

# Pushing a tag such as v0.2.0 runs the full test suite (unit + end-to-end) and
# builds the CLI for every supported platform; only a green run publishes the
# GitHub Release with the archives and checksums, and publishes both crates to
# crates.io (openlist first, then openlist-cli, which depends on it).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: openlist

jobs:
  verify-version:
    name: Verify tag matches crate version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with workspace version
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "openlist-cli") | .version')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag: ${GITHUB_REF_NAME} (${tag}), openlist-cli version: ${version}"
          if [ "${version}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match openlist-cli version ${version}. Bump [workspace.package] version before tagging."
            exit 1
          fi

      # openlist-cli publishes against the openlist crate from crates.io, so the
      # version requirement in [workspace.dependencies] has to be bumped in the
      # same commit as [workspace.package] version.
      - name: Compare openlist dependency requirement with version
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '.packages[] | select(.name == "openlist") | .version' <<<"${metadata}")
          req=$(jq -r '.packages[] | select(.name == "openlist-cli")
            | .dependencies[] | select(.name == "openlist") | .req' <<<"${metadata}")
          echo "openlist version: ${version}, openlist-cli requires: ${req}"
          if [ "${req#^}" != "${version}" ]; then
            echo "::error::openlist-cli requires openlist ${req} but the workspace version is ${version}. Update the version in [workspace.dependencies]."
            exit 1
          fi

  # All tests (unit + end-to-end) run in the Integration workflow. Calling it
  # here gates the build and publish on a green run without duplicating the
  # job definitions.
  integration:
    name: Integration tests
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }}
    needs: [verify-version, integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners are used for every target, avoiding cross-compilation
          # of native dependencies (aws-lc-sys from rustls).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            musl: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          echo "CC=musl-gcc" >> "${GITHUB_ENV}"
          target_var=$(echo "${{ matrix.target }}" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
          echo "CARGO_TARGET_${target_var}_LINKER=musl-gcc" >> "${GITHUB_ENV}"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p openlist-cli

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="${BIN_NAME}-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          # AGPL-3.0 requires conveying the licence with the binary.
          tar -czf "dist/${archive}" -C "target/${TARGET}/release" "${BIN_NAME}" \
            -C "${GITHUB_WORKSPACE}" LICENSE

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/$env:BIN_NAME.exe", "LICENSE" `
            -DestinationPath "dist/$env:BIN_NAME-$env:GITHUB_REF_NAME-$env:TARGET.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-crates:
    name: Publish to crates.io
    # Gated on `build` so a version is only uploaded once the binaries compile
    # for every platform: a published version can be yanked but never deleted.
    # Each crate is skipped when that exact version is already on crates.io, so
    # re-running a release that failed halfway is safe.
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # crates.io API token (publish scope, including new crates).
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      USER_AGENT: openlist-rs release workflow (https://github.com/Syndim/openlist-rs)
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check crates.io token is configured
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is empty. Add a crates.io API token with publish scope as a repository secret named CARGO_REGISTRY_TOKEN."
            exit 1
          fi

      - name: Publish crates
        run: |
          set -euo pipefail

          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "openlist") | .version')
          echo "Publishing version ${version}"

          # Path crates.io uses for a crate in the sparse index.
          index_path() {
            local name="$1"
            case "${#name}" in
              1) echo "1/${name}" ;;
              2) echo "2/${name}" ;;
              3) echo "3/${name:0:1}/${name}" ;;
              *) echo "${name:0:2}/${name:2:2}/${name}" ;;
            esac
          }

          already_published() {
            local code
            code=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
              -H "User-Agent: ${USER_AGENT}" \
              "https://crates.io/api/v1/crates/$1/$2")
            [ "${code}" = "200" ]
          }

          # cargo publish for openlist-cli resolves openlist from the registry, so
          # the new version has to be visible in the index first.
          wait_for_index() {
            local url
            url="https://index.crates.io/$(index_path "$1")"
            for _ in $(seq 1 60); do
              if curl -sf -H "User-Agent: ${USER_AGENT}" "${url}" \
                | jq -s -e --arg v "${version}" 'any(.[]; .vers == $v)' >/dev/null 2>&1; then
                echo "$1 ${version} is in the index"
                return 0
              fi
              sleep 5
            done
            echo "::error::$1 ${version} did not reach the crates.io index" >&2
            return 1
          }

          for crate in openlist openlist-cli; do
            if already_published "${crate}" "${version}"; then
              echo "::notice::${crate} ${version} is already on crates.io, skipping"
              continue
            fi
            if [ "${crate}" != "openlist" ]; then
              wait_for_index openlist
            fi
            cargo publish --locked -p "${crate}"
          done

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.BIN_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
